[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-phyloflow"
version = "0.1.0"
description = "Decision-aware phylogenomics with reproducible workflows and transparent provenance"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Luka Ivkovic" },
]
keywords = [
    "bioinformatics",
    "evolutionary biology",
    "FAIR data",
    "phylogenetics",
    "phylogenomics",
    "reproducibility",
    "scientific workflows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "jinja2>=3.1.4",
    "pandas>=2.2.2",
    "biopython>=1.83",
    "rich>=13.7.1",
]

[project.urls]
Homepage = "https://github.com/LukaIvkovicc/FAIR-PhyloFlow"
Repository = "https://github.com/LukaIvkovicc/FAIR-PhyloFlow"
Issues = "https://github.com/LukaIvkovicc/FAIR-PhyloFlow/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "mypy>=1.10.0",
    "numpy<2.5",
    "pandas-stubs>=2.2.2",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "setuptools>=77",
    "twine>=5.1.0",
    "types-PyYAML>=6.0.12",
    "wheel",
]
ui = ["streamlit>=1.36.0"]

[project.scripts]
fair-phyloflow = "fair_phyloflow.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fair_phyloflow = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fair_phyloflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/fair_phyloflow"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
