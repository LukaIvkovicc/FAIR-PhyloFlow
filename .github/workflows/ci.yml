name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest --cov=fair_phyloflow --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests app
      - name: Check formatting
        run: python -m ruff format --check src tests app
      - name: Type-check
        run: python -m mypy
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Verify wheel installation and CLI
        run: |
          python -m venv /tmp/fair-phyloflow-wheel
          /tmp/fair-phyloflow-wheel/bin/python -m pip install dist/*.whl
          /tmp/fair-phyloflow-wheel/bin/fair-phyloflow --help

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: fair-phyloflow:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  iqtree-contract:
    name: Real IQ-TREE 2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-file: environment.yml
          cache-environment: true
          post-cleanup: all
      - name: Execute tiny synthetic alignment-to-concordance route
        shell: bash -el {0}
        run: |
          fair-phyloflow execute tests/fixtures/iqtree_integration/project.yaml
          fair-phyloflow report tests/fixtures/iqtree_integration/project.yaml
          fair-phyloflow package tests/fixtures/iqtree_integration/project.yaml
      - name: Verify completed route
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest_path = Path("results/ci_iqtree/08_runs/latest-run.json")
          latest = json.loads(latest_path.read_text())
          state = json.loads((latest_path.parent / latest["run_id"] / "run-state.json").read_text())
          assert state["status"] == "complete", state
          assert all(task["status"] == "verified" for task in state["tasks"].values())
          PY
