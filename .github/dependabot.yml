version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: conda
    directory: /
    schedule:
      interval: monthly
    # The execution contract currently supports IQ-TREE 2 only.
    ignore:
      - dependency-name: iqtree
        update-types: ["version-update:semver-major"]
