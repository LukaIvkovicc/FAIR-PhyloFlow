name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove credentials, private paths, and unpublished data before submitting."
  - type: input
    id: version
    attributes:
      label: FAIR PhyloFlow version or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide a minimal configuration or exact sequence of steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and relevant external-tool versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
