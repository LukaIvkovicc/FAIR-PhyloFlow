<rect x="84" y="613" width="207" height="98" rx="14" fill="#eaf4ef" stroke="#bbd7cd"/>
<text x="100" y="646" class="node">Selected loci</text>
<text x="100" y="675" class="small">Only included FASTAs</text>
<rect x="341" y="592" width="266" height="85" rx="14" fill="#eaf4ef" stroke="#bbd7cd"/>
<text x="357" y="625" class="node">Concatenate + infer</text>
<text x="357" y="654" class="small">Reference ML tree</text>
<rect x="341" y="720" width="266" height="85" rx="14" fill="#eaf4ef" stroke="#bbd7cd"/>
<text x="357" y="753" class="node">Per-locus inference</text>
<text x="357" y="782" class="small">Verified gene-tree set</text>
<rect x="674" y="613" width="220" height="192" rx="14" fill="#eaf4ef" stroke="#bbd7cd"/>
<text x="690" y="646" class="node">Concordance</text>
<rect x="950" y="642" width="192" height="122" rx="14" fill="#eaf4ef" stroke="#bbd7cd"/>
<text x="966" y="675" class="node">Branch metrics</text>
<text x="690" y="685" class="small">gCF: reference tree</text>
<text x="690" y="711" class="small">+ gene-tree set</text>
<text x="690" y="749" class="small">sCF: reference tree</text>
<text x="690" y="775" class="small">+ concatenation</text>
<text x="966" y="707" class="small">gCF / sCF joined</text>
<text x="966" y="733" class="small">by branch ID</text>
<path d="M291 646H315V634H341" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M315 646V762H341" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M607 634H674" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M607 762H674" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M894 703H950" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="84" y="839" class="body">Support ≠ gene concordance (gCF) ≠ site concordance (sCF).</text>
<text x="84" y="871" class="small">Keep each measure explicit; biological interpretation remains with the researcher.</text>
<rect x="1194" y="528" width="546" height="365" rx="14" fill="#f9f5e9" stroke="#d8cba4" stroke-dasharray="7 5"/>
<text x="1218" y="565" class="eyebrow">03  /  CAPABILITY BOUNDARIES</text>
<text x="1218" y="604" class="head">Commands / guidance</text>
<text x="1218" y="639" class="body">RAxML-NG + ParGenes: commands</text>
<text x="1218" y="669" class="body">ASTRAL + BUCKy: guidance / scaffolds</text>
<text x="1218" y="708" class="head">Future automation</text>
<text x="1218" y="742" class="body">Genome retrieval · reads · ortholog inference</text>
<text x="1218" y="772" class="body">BUSCO execution · species-tree execution</text>
<text x="1218" y="802" class="body">Full reticulation analysis</text>
<text x="1218" y="839" class="small">Existing gene-tree input: route selection only.</text>
<text x="1218" y="870" class="small">Species delimitation is not an automated verdict.</text>
<rect x="60" y="919" width="1680" height="202" rx="14" fill="#153e43" stroke="#153e43"/>
<text x="84" y="957" class="eyebrow" style="fill:#8ed9c6">04  /  EVIDENCE AND INTEGRITY SPAN EVERY STAGE</text>
<text x="84" y="998" class="head white">Decisions stay visible</text>
<text x="84" y="1033" class="small light">Input registry · selected / excluded loci</text>
<text x="84" y="1063" class="small light">Route rationale · configuration snapshot</text>
<text x="628" y="998" class="head white">Execution stays auditable</text>
<text x="628" y="1033" class="small light">Immutable plans · staged inputs · seeds / versions</text>
<text x="628" y="1063" class="small light">Locks · checksums · safe resume / invalidation</text>
<text x="1194" y="998" class="head white">Outputs stay inspectable</text>
<text x="1194" y="1033" class="small light">Reports · trees · concordance · logs</text>
<text x="1194" y="1063" class="small light">Provenance · SHA-256 · RO-Crate metadata</text>
<text x="84" y="1101" class="small light">verify-package checks local package integrity. FAIR-oriented packaging supports reuse; repository deposition is a separate step.</text>
<text x="60" y="1160" class="body">Researcher configures and interprets · PhyloFlow checks, orchestrates, and packages · IQ-TREE infers trees and calculates concordance</text>
<text x="60" y="1187" class="small">Example alignments are synthetic workflow fixtures; biological validation is a separate milestone.</text>
</svg>
