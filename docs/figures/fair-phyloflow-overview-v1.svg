<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">FAIR PhyloFlow: from biological question to reusable phylogenomic evidence</title>
<desc id="desc">Five stages connect curated inputs, readiness and locus selection, route recommendation, user-invoked fixed IQ-TREE execution, and reusable evidence. Reporting is available without new inference and may include existing results. Researchers configure and interpret; PhyloFlow checks and orchestrates; IQ-TREE infers trees and calculates concordance. A detailed inset shows the implemented IQ-TREE 2 alignment-to-concordance route. Excluded loci remain documented. Provenance and integrity span the workflow. Alternative tools and future data layers are explicitly marked. Branch support, gene concordance, and site concordance remain distinct.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#54777c"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#18333c}.title{font-size:52px;font-weight:700}.subtitle{font-size:23px;fill:#49636a}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#19796c}.head{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#49636a}.white{fill:#fff}.light{fill:#d3e9e5}.node{font-size:19px;font-weight:700}.mono{font-family:DejaVu Sans Mono,monospace;font-size:16px;fill:#19796c}</style>
<rect width="1800" height="1200" fill="#f5f7f4"/>
<rect x="0" y="0" width="1800" height="12" fill="#147d70"/>
<text x="60" y="57" class="eyebrow">DECISION-AWARE · REPRODUCIBLE · TRACEABLE</text>
<text x="60" y="120" class="title">FAIR PhyloFlow</text>
<text x="60" y="162" class="subtitle">From a biological question to inspectable, reusable phylogenomic evidence</text>
<rect x="1430" y="50" width="310" height="53" rx="14" fill="#e5eeea" stroke="#e5eeea"/>
<text x="1450" y="83" class="small">v0.1.0  /  RESEARCH Prototype</text>
<text x="60" y="215" class="eyebrow">01  /  THE DECISION-AND-EVIDENCE LIFECYCLE</text>
<rect x="60" y="239" width="312" height="224" rx="14" fill="#fff" stroke="#d4dfdc"/>
<text x="82" y="277" class="head">Frame the question</text>
<text x="82" y="319" class="body">Question + assumptions</text>
<text x="82" y="348" class="body">Taxa / outgroup + config</text>
<text x="82" y="377" class="body">Use curated inputs</text>
<text x="82" y="436" class="mono">project.yaml</text>
<path d="M373 350H399" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="402" y="239" width="312" height="224" rx="14" fill="#fff" stroke="#d4dfdc"/>
<text x="424" y="277" class="head">Assess readiness</text>
<text x="424" y="319" class="body">Check input consistency</text>
<text x="424" y="348" class="body">Measure and select loci</text>
<text x="424" y="377" class="body">Keep exclusion reasons</text>
<text x="424" y="436" class="mono">check · plan</text>
<path d="M715 350H741" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="744" y="239" width="312" height="224" rx="14" fill="#fff" stroke="#d4dfdc"/>
<text x="766" y="277" class="head">Choose a route</text>
<text x="766" y="319" class="body">Question + data + profile</text>
<text x="766" y="348" class="body">Rationale and warnings</text>
<text x="766" y="377" class="body">Explicit tool support levels</text>
<text x="766" y="436" class="mono">plan · status</text>
<path d="M1057 350H1083" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1086" y="239" width="312" height="224" rx="14" fill="#fff" stroke="#d4dfdc"/>
<text x="1108" y="277" class="head">Execute + validate</text>
<text x="1108" y="319" class="body">User invokes fixed route</text>
<text x="1108" y="348" class="body">IQ-TREE 2 trees + gCF/sCF</text>
<text x="1108" y="377" class="body">Validate required artifacts</text>
<text x="1108" y="436" class="mono">execute</text>
<path d="M1399 350H1425" fill="none" stroke="#54777c" stroke-width="2.5" marker-end="url(#arrow)"/>
