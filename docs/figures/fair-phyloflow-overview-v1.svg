<text x="1450" y="277" class="head">Report + reuse</text>
<text x="1450" y="319" class="body">Decisions + evidence</text>
<text x="1450" y="348" class="body">Provenance + FAIR package</text>
<text x="1450" y="377" class="body">Inventory + checksums</text>
<text x="1450" y="436" class="mono">report · package</text>
<text x="60" y="490" class="small">Prepared nucleotide alignments drive execution; accession metadata supports registration. Route recommendations do not launch tools.</text>
<text x="60" y="515" class="small">Reporting is available without new inference and can include existing results.</text>
<rect x="60" y="528" width="1110" height="365" rx="14" fill="#fff" stroke="#d4dfdc"/>
